name: CI/CD - Production

on:
  push:
    branches: [ main ]   # Triggers when you merge to main

env:
  NAMESPACE: prod
  TAG: prod-${{ github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production   # Must match the environment name you created
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push images
        run: |
          for img in user product order notification frontend; do
            docker build -f Dockerfile.$img -t ${{ secrets.DOCKER_USERNAME }}/$img-service:${{ env.TAG }} .
            docker push ${{ secrets.DOCKER_USERNAME }}/$img-service:${{ env.TAG }}
          done

      - name: Create Kubernetes cluster with Kind
        uses: helm/kind-action@v1.8.0

      - name: Deploy to Kubernetes
        run: |
          kubectl create namespace ${{ env.NAMESPACE }} --dry-run=client -o yaml | kubectl apply -f -
          cd k8s/overlays/prod
          kustomize edit set image \
            user-service=${{ secrets.DOCKER_USERNAME }}/user-service:${{ env.TAG }} \
            product-service=${{ secrets.DOCKER_USERNAME }}/product-service:${{ env.TAG }} \
            order-service=${{ secrets.DOCKER_USERNAME }}/order-service:${{ env.TAG }} \
            notification-service=${{ secrets.DOCKER_USERNAME }}/notification-service:${{ env.TAG }} \
            frontend=${{ secrets.DOCKER_USERNAME }}/frontend:${{ env.TAG }}
          kustomize build . | kubectl apply -f -
          kubectl -n ${{ env.NAMESPACE }} rollout status deployment --all --timeout=5m