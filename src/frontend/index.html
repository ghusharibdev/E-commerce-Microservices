<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E‑Commerce Dashboard</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🛍️ E‑Commerce Platform</h1>
            <div id="auth-status" class="auth-status">Not logged in</div>
        </header>

        <!-- Login / Register Section -->
        <section id="auth-section" class="card">
            <h2>Authentication</h2>
            <div class="form-group">
                <input type="text" id="login-username" placeholder="Username" />
                <input type="password" id="login-password" placeholder="Password" />
                <button id="login-btn">Login</button>
                <button id="register-btn">Register</button>
            </div>
        </section>

        <!-- Product Catalog Section -->
        <section id="products-section" class="card">
            <h2>Products</h2>
            <div id="products-list" class="products-grid">
                <!-- Products will be injected here -->
                <p>Loading products...</p>
            </div>
        </section>

        <!-- Order Section (only visible when logged in) -->
        <section id="order-section" class="card hidden">
            <h2>📝 Place Order</h2>
            <div class="form-group">
                <label for="product-select">Select Product:</label>
                <select id="product-select"></select>
                <label for="quantity">Quantity:</label>
                <input type="number" id="quantity" value="1" min="1" />
                <button id="order-btn">Order Now</button>
            </div>
            <div id="order-message"></div>
        </section>
    </div>

    <script src="app.js"></script>
</body>
</html>
